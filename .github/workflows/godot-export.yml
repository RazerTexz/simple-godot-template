name: Godot Export
on: workflow_dispatch
env:
  GODOT_VERSION: 4.6-stable
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: RELEASE_USER
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: RELEASE_PASSWORD

jobs:
  godot-export:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Create keystore
        run: |
          keytool \
            -genkeypair \
            -keyalg RSA \
            -keystore release.keystore \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -keypass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -dname "CN=Release" \
            -validity 9999

      - name: Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v$GODOT_VERSION_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v$GODOT_VERSION_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: exported
          path: ${{ steps.export.outputs.archive_directory }}
